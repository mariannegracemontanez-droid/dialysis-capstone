name: super_admin_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  # The notice (message) system, shared with the Admin panel so both halves
  # of the product report an outcome the same way. See
  # packages/curenurture_notice/README.md.
  curenurture_notice:
    path: ../packages/curenurture_notice
  flutter_dotenv: ^6.0.1
  fl_chart: ^1.2.0
  intl: ^0.19.0


  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1

  # Donation history export (Donations page). pdf is the same library the
  # mobile app's data export already uses; archive is what pdf itself
  # depends on, used here to zip the .xlsx; web is the browser download,
  # matching admin_panel's file_download.dart.
  pdf: ^3.11.1
  archive: any
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/
    - assets/images/curenurture_background.jpeg
    - assets/images/CureNurture_CircleLogo.png
    # Montserrat (SIL OFL, copied from the Donation app) -- embedded in the
    # donation history PDF because the PDF's built-in fonts cannot draw "₱"
    # or accented donor names.
    - assets/fonts/Montserrat-Regular.ttf
    - assets/fonts/Montserrat-Bold.ttf
    - .env
